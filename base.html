<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block titulo %}Jornada do Herói{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <meta name="theme-color" content="#1b1446">
</head>
<body class="{% block body_class %}{% endblock %}">
  {% if not self.body_class() %}<div class="estrelas-bg"></div>{% endif %}
  <main>
    {% with msgs = get_flashed_messages() %}
      {% if msgs %}<div class="wrap" style="padding-bottom:0"><ul class="flashes">{% for m in msgs %}<li>{{ m }}</li>{% endfor %}</ul></div>{% endif %}
    {% endwith %}
    {% block conteudo %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
