{% extends "base.html" %}
{% block titulo %}Painel dos Pais{% endblock %}
{% block body_class %}pais{% endblock %}
{% block conteudo %}
<div class="wrap" style="max-width:380px;padding-top:60px">
  <form method="post" class="card" style="text-align:center">
    <div style="font-size:54px">🔒</div>
    <h2>Painel dos Pais</h2>
    <label for="pin">PIN</label>
    <input type="password" id="pin" name="pin" inputmode="numeric" autofocus>
    <button class="btn roxo" style="margin-top:14px;width:100%">Entrar</button>
    <p class="mini">O PIN fica na variável PARENT_PIN (padrão 1234).</p>
    <a href="{{ url_for('inicio') }}" class="mini">← voltar para o jogo</a>
  </form>
</div>
{% endblock %}
